# ============================================================
#  Docker Compose — Wheel of Doom(b)
#  Single container, mapped data volume, port 9642
# ============================================================

services:
  wheel:
    build: .
    container_name: wheel-of-doomb
    ports:
      - "9642:9642"
    volumes:
      # Persist SQLite database AND all media (uploaded user media + the
      # default song/cheer/graphic pools under media/default) on the host volume
      - wheel-data:/data
      # OR: uncomment below to use a local directory instead
      # - ./data:/data
    restart: unless-stopped
    environment:
      - DB_DIR=/data
      # ⚠️ CHANGE THIS before deploying to a shared network
      - ADMIN_PASSWORD=setadminpass
      - SITE_TITLE=nuwheel

volumes:
  wheel-data:
